<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f0f8ff;
        }

        header {
            background-color: #3498db;
            color: white;
            padding: 20px 0;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 50px 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c0392b;
        }

        #message {
            margin-top: 20px;
            font-size: 22px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Awesome Website</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Welcome!</h2>
        <p>This is my first interactive web page.</p>
        <button onclick="changeText()">Click Me!</button>
        <p id="message">Hello, World!</p>
    </main>

    <script>
        function changeText() {
            document.getElementById("message").innerText = "You clicked the button! 🎉";
        }
    </script>
</body>
</html>
